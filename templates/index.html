<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 1.21.1 RCON WebUI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>🔌 RCON 连接</h2>
                <p>Minecraft 1.21.1 远程控制台</p>
            </div>
            <div class="conn-panel">
                <div class="status-indicator">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">未连接</span>
                </div>
                <input type="text" id="host" value="127.0.0.1" placeholder="主机地址">
                <input type="number" id="port" value="25575" placeholder="RCON端口">
                <input type="password" id="password" placeholder="RCON密码">
                <div class="btn-group">
                    <button class="btn-primary" onclick="App.connect()">连接</button>
                    <button class="btn-secondary" onclick="App.disconnect()">断开</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="cmd-search" placeholder="搜索命令..." oninput="App.searchCommands(this.value)">
            </div>
            <div class="tree-container">
                <ul class="cmd-tree" id="cmd-tree"></ul>
            </div>
        </aside>

        <!-- 主区域 -->
        <main id="main">
            <div class="main-header">
                <h1>🎮 命令构建器</h1>
                <button class="btn-secondary" onclick="App.clearBuilder()">清空</button>
            </div>

            <div class="preview-section">
                <div class="preview-label">命令预览</div>
                <div id="command-preview">/</div>
                <div class="btn-group" style="margin-top:8px;">
                    <button class="btn-primary" onclick="App.sendCommand()">📤 发送到服务器</button>
                    <button class="btn-secondary" onclick="App.copyCommand()">📋 复制</button>
                    <button class="btn-secondary" onclick="App.saveCommand()">💾 保存</button>
                </div>
            </div>

            <div class="builder-section" id="builder">
                <p class="placeholder">请从左侧选择一个命令开始构建</p>
            </div>

            <div class="action-bar">
                <button class="btn-primary" onclick="App.sendCommand()">执行命令</button>
                <button class="btn-secondary" onclick="App.copyCommand()">复制</button>
                <button class="btn-danger" onclick="App.clearBuilder()">清空</button>
            </div>

            <div class="log-section">
                <div class="log-header">
                    <span>📜 终端日志</span>
                    <button class="btn-secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="App.clearLog()">清空</button>
                </div>
                <div id="log"></div>
            </div>
        </main>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
